<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إدارة وسوم شعرة</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f0e8; color: #23170f; }
      main { width: min(1100px, calc(100% - 32px)); margin: 32px auto; display: grid; gap: 18px; }
      h1 { margin: 0; font-size: clamp(24px, 4vw, 42px); }
      .panel, .reel { background: rgba(255, 255, 255, 0.72); border: 1px solid rgba(122, 90, 59, 0.22); border-radius: 18px; box-shadow: 0 18px 50px rgba(52, 35, 22, 0.08); }
      .panel { padding: 18px; display: grid; gap: 12px; }
      label { display: grid; gap: 6px; font-weight: 800; }
      input, textarea, button { font: inherit; border-radius: 12px; }
      input, textarea { border: 1px solid rgba(122, 90, 59, 0.28); padding: 11px 12px; background: #fffaf5; }
      textarea { min-height: 70px; resize: vertical; direction: rtl; }
      button { border: 0; padding: 11px 16px; background: #7a5a3b; color: white; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: 0.55; cursor: wait; }
      .grid { display: grid; gap: 12px; }
      .reel { padding: 14px; display: grid; grid-template-columns: 86px 1fr; gap: 14px; align-items: start; }
      .thumb { width: 86px; height: 112px; border-radius: 14px; object-fit: cover; background: #ddd0c4; }
      .title { font-weight: 900; line-height: 1.45; margin-bottom: 8px; }
      .meta { color: rgba(35, 23, 15, 0.64); font-size: 13px; direction: ltr; text-align: right; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
      .status { color: #236b2f; font-weight: 800; }
      @media (max-width: 640px) { .reel { grid-template-columns: 1fr; } .thumb { width: 100%; height: 180px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>إدارة وسوم الريلز</h1>
      <section class="panel">
        <label>رمز الإدارة
          <input id="token" type="password" autocomplete="current-password" placeholder="SHARAH_ADMIN_TOKEN" />
        </label>
        <button id="load" type="button">تحميل الريلز</button>
        <div id="message" class="status" aria-live="polite"></div>
      </section>
      <section id="reels" class="grid" aria-live="polite"></section>
    </main>
    <script>
      const API_BASE = "/v01/api";
      const token = document.getElementById("token");
      const load = document.getElementById("load");
      const reelsEl = document.getElementById("reels");
      const message = document.getElementById("message");

      function tagsText(tags) {
        return Array.isArray(tags) ? tags.join("، ") : "";
      }

      function escapeHtml(value) {
        return String(value || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      }

      async function saveTags(reel, textarea, status, button) {
        button.disabled = true;
        status.textContent = "جار الحفظ...";
        try {
          const response = await fetch(`${API_BASE}/sharah/reels/facebook/${encodeURIComponent(reel.id)}/tags`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Admin-Token": token.value.trim() },
            body: JSON.stringify({ tags: textarea.value }),
          });
          if (!response.ok) throw new Error(`status=${response.status}`);
          const saved = await response.json();
          textarea.value = tagsText(saved.tags);
          status.textContent = "تم الحفظ";
        } catch (error) {
          status.textContent = "فشل الحفظ";
        } finally {
          button.disabled = false;
        }
      }

      function render(reels) {
        reelsEl.innerHTML = "";
        for (const reel of reels) {
          const card = document.createElement("article");
          card.className = "reel";
          card.innerHTML = `
            <img class="thumb" src="${escapeHtml(reel.thumbnail || "")}" alt="" loading="lazy" />
            <div>
              <div class="title">${escapeHtml(reel.title || reel.id)}</div>
              <div class="meta">${escapeHtml(reel.id)}</div>
              <textarea aria-label="وسوم ${escapeHtml(reel.title || reel.id)}">${escapeHtml(tagsText(reel.tags))}</textarea>
              <div class="actions"><button type="button">حفظ الوسوم</button><span class="status"></span></div>
            </div>
          `;
          const textarea = card.querySelector("textarea");
          const button = card.querySelector("button");
          const status = card.querySelector(".status");
          button.addEventListener("click", () => saveTags(reel, textarea, status, button));
          reelsEl.appendChild(card);
        }
      }

      load.addEventListener("click", async () => {
        message.textContent = "جار التحميل...";
        load.disabled = true;
        try {
          const response = await fetch(`${API_BASE}/sharah/reels?limit=10000&_ts=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`status=${response.status}`);
          const reels = await response.json();
          render(Array.isArray(reels) ? reels : []);
          message.textContent = `تم تحميل ${Array.isArray(reels) ? reels.length : 0} ريل`;
        } catch (error) {
          message.textContent = "فشل تحميل الريلز";
        } finally {
          load.disabled = false;
        }
      });
    </script>
  </body>
</html>
