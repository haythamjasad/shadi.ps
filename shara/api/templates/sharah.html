    <script>
      (function () {
        var banner = document.getElementById('sharaHeroBanner');
        if (!banner) return;

        function storeApiBase() {
          var host = window.location.hostname;
          if (host === 'shara.shadi.ps' || host === 'www.shadi.ps' || host === 'shadi.ps') {
            return 'https://store.shadi.ps/api/v01';
          }
          return window.location.protocol + '//' + host + ':4000/api/v01';
        }

        function resolveBannerUrl(path) {
          if (!path) return '';
          if (/^https?:\/\//i.test(path) || /^data:/i.test(path)) return path;
          return storeApiBase().replace(/\/api\/v01\/?$/, '') + (path.charAt(0) === '/' ? path : '/' + path);
        }

        fetch(storeApiBase() + '/settings/banner/shara')
          .then(function (response) { return response.ok ? response.json() : null; })
          .then(function (data) {
            var nextUrl = resolveBannerUrl(data && data.image_url);
            if (nextUrl) banner.src = nextUrl;
          })
          .catch(function () {});
      })();
    </script>
