services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sharah_root_password
      MYSQL_DATABASE: sharah_db
      MYSQL_USER: sharah_user
      MYSQL_PASSWORD: sharah_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_import.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  sharrah:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: sharah_db
      MYSQL_USER: sharah_user
      MYSQL_PASSWORD: sharah_password
      SHARAH_REELS_SOURCE: db
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
